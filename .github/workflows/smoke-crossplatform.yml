# Build the ordinary macOS/Linux Desktop packages and exercise relocated or
# extracted layouts through production JavaScript and typed Tauri commands.
# The existing Unix sidecar watchdog remains part of the same native-runner gate.
name: Smoke (cross-platform)

permissions:
  contents: read

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cross-platform-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: packaged Desktop smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      AIGUARD_EXTENSION_IDENTITY: ${{ github.workspace }}/config/chrome-extension-identity.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux package and WebView dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-daemon libfuse2t64 libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-build.lock

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Python deps (locked, incl. the PyInstaller pin)
        run: |
          python -m pip install pip==26.1.2
          python -m pip install --require-hashes -r requirements-build.lock

      - name: Pre-download the offline NER model
        run: python scripts/prewarm_ner.py

      - name: Set up Rust (build_sidecar reads the host triple from rustc)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
        with:
          toolchain: "1.97.0"

      - name: Cache cargo
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            native-broker
            desktop/src-tauri

      - name: Record the exact Python child executable
        run: python -c "import sys; print('AIGUARD_TEST_PYTHON=' + sys.executable)" >> "$GITHUB_ENV"

      - name: Run native broker transport, backend, and lifecycle smoke
        env:
          PYTHONUTF8: "1"
        run: cargo test --locked --manifest-path native-broker/Cargo.toml

      - name: Build + stage the sidecar
        run: python scripts/build_sidecar.py

      - name: Run the sidecar lifecycle + watchdog smoke check
        run: python scripts/smoke_sidecar.py

      - name: Preserve the exact pre-linuxdeploy AppImage backend
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          triple=$(rustc -vV | sed -n 's/^host: //p')
          source="desktop/src-tauri/binaries/aiguard-$triple"
          preserved="$RUNNER_TEMP/aiguard-appimage-backend"
          test -f "$source"
          test ! -e "$preserved"
          cp -- "$source" "$preserved"
          chmod 0755 "$preserved"
          cmp -- "$source" "$preserved"

      - name: Build + stage the native broker
        run: python scripts/build_native_broker.py

      - name: Install locked Desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Stage invalid build-only Tauri resource manifests
        run: python scripts/prepare_desktop_native_package.py --build-placeholders

      - name: Build the feature-gated macOS app
        if: matrix.os == 'macos-latest'
        working-directory: desktop
        run: >-
          npm run tauri -- build --bundles app --features package-smoke --ci --no-sign
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Relocate and smoke the exact macOS app layout
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="desktop/src-tauri/target/release/bundle/macos"
          count=$(find "$bundle_root" -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')
          test "$count" = "1"
          app=$(find "$bundle_root" -maxdepth 1 -type d -name '*.app' -print -quit)
          mkdir -p artifacts/desktop-native-macos
          relocated="$GITHUB_WORKSPACE/artifacts/desktop-native-macos/AI Guard.app"
          test ! -e "$relocated"
          ditto "$app" "$relocated"
          package="$relocated/Contents/MacOS"
          identity="$AIGUARD_EXTENSION_IDENTITY"
          cleanup_registration() {
            "$package/desktop" --unregister-native-host >/dev/null 2>&1 || true
          }
          trap cleanup_registration EXIT

          # Relocation is the supported unsigned macOS package path here; this
          # does not claim installation, signing, or notarization.
          "$package/desktop" --repair-native-host
          python scripts/verify_native_host_registration.py \
            --shape macos --state present \
            --adapter "$package/aiguard-chrome-native-host" \
            --identity "$identity" \
            > artifacts/desktop-native-macos/registration-present.json
          python scripts/smoke_desktop_native_package.py "$package" --repetitions 2 > artifacts/desktop-native-macos/smoke-evidence.json

          "$package/desktop" --repair-native-host
          python scripts/verify_native_host_registration.py \
            --shape macos --state present \
            --adapter "$package/aiguard-chrome-native-host" \
            --identity "$identity" \
            > artifacts/desktop-native-macos/repair-registration-present.json
          python scripts/smoke_desktop_native_package.py "$package" --repetitions 2 > artifacts/desktop-native-macos/repair-smoke-evidence.json
          (cd "$package" && shasum -a 256 desktop aiguard-native-broker aiguard-chrome-native-host aiguard-native-host-manager aiguard native-components-v1.json) > artifacts/desktop-native-macos/component-sha256.txt

          "$package/desktop" --unregister-native-host
          python scripts/verify_native_host_registration.py \
            --shape macos --state absent \
            --adapter "$package/aiguard-chrome-native-host" \
            --identity "$identity" \
            > artifacts/desktop-native-macos/registration-absent.json
          test ! -e "/tmp/aiguard-native-broker-$(id -u)-v1"

          # Reinstall for a relocatable app means restoring the exact per-user
          # registration from the still-present exact bundle.
          "$package/desktop" --repair-native-host
          python scripts/verify_native_host_registration.py \
            --shape macos --state present \
            --adapter "$package/aiguard-chrome-native-host" \
            --identity "$identity" \
            > artifacts/desktop-native-macos/reinstall-registration-present.json
          python scripts/smoke_desktop_native_package.py "$package" --repetitions 2 > artifacts/desktop-native-macos/macos-reinstall-smoke-evidence.json
          "$package/desktop" --unregister-native-host
          python scripts/verify_native_host_registration.py \
            --shape macos --state absent \
            --adapter "$package/aiguard-chrome-native-host" \
            --identity "$identity" \
            > artifacts/desktop-native-macos/final-registration-absent.json
          test ! -e "/tmp/aiguard-native-broker-$(id -u)-v1"
          printf '%s\n' '["relocation","repair","registration-cleanup","registration-reinstall","final-cleanup"]' > artifacts/desktop-native-macos/lifecycle.json

          archive="$GITHUB_WORKSPACE/artifacts/desktop-native-macos/AI-Guard-macos-tested-app.tar.gz"
          tar -C "$(dirname "$relocated")" -czf "$archive" "$(basename "$relocated")"
          (cd artifacts/desktop-native-macos && shasum -a 256 AI-Guard-macos-tested-app.tar.gz) > artifacts/desktop-native-macos/archive-sha256.txt
          trap - EXIT
          cat artifacts/desktop-native-macos/smoke-evidence.json
          cat artifacts/desktop-native-macos/macos-reinstall-smoke-evidence.json

      - name: Upload the exact tested macOS app and value-free evidence
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-native-macos-${{ github.sha }}
          path: |
            artifacts/desktop-native-macos/AI-Guard-macos-tested-app.tar.gz
            artifacts/desktop-native-macos/*.json
            artifacts/desktop-native-macos/*.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Build the feature-gated Linux DEB and AppImage
        if: matrix.os == 'ubuntu-latest'
        working-directory: desktop
        run: >-
          npm run tauri -- build --bundles deb,appimage --features package-smoke --ci --no-sign
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Finalize the AppImage manifest from post-linuxdeploy bytes
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          APPIMAGE_PLUGIN_SHA256: a45d3e227bc7f397e9cf6bfa4c9507494efa2293357b6e86690a3de2ca992e79
          APPIMAGE_PLUGIN_URL: https://api.github.com/repos/linuxdeploy/linuxdeploy-plugin-appimage/releases/assets/497460911
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          appimage_root="desktop/src-tauri/target/release/bundle/appimage"
          test "$(find "$appimage_root" -maxdepth 1 -type f -name '*.AppImage' | wc -l | tr -d ' ')" = "1"
          test "$(find "$appimage_root" -maxdepth 1 -type d -name '*.AppDir' | wc -l | tr -d ' ')" = "1"
          appimage=$(find "$appimage_root" -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          appdir=$(find "$appimage_root" -maxdepth 1 -type d -name '*.AppDir' -print -quit)
          plugin="$RUNNER_TEMP/linuxdeploy-plugin-appimage-x86_64.AppImage"
          test ! -e "$plugin"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --header 'Accept: application/octet-stream' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --output "$plugin" \
            "$APPIMAGE_PLUGIN_URL"
          echo "$APPIMAGE_PLUGIN_SHA256  $plugin" | sha256sum --check --strict
          chmod 0755 "$plugin"
          python scripts/prepare_desktop_native_package.py --finalize-appimage "$appimage" \
            --appdir "$appdir" \
            --appimage-backend-source "$RUNNER_TEMP/aiguard-appimage-backend" \
            --appimage-plugin "$plugin" \
            --appimage-arch x86_64

      - name: Extract and smoke the exact Linux package layouts
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          deb_root="desktop/src-tauri/target/release/bundle/deb"
          appimage_root="desktop/src-tauri/target/release/bundle/appimage"
          test "$(find "$deb_root" -maxdepth 1 -type f -name '*.deb' | wc -l | tr -d ' ')" = "1"
          test "$(find "$appimage_root" -maxdepth 1 -type f -name '*.AppImage' | wc -l | tr -d ' ')" = "1"
          deb=$(find "$deb_root" -maxdepth 1 -type f -name '*.deb' -print -quit)
          appimage=$(find "$appimage_root" -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          identity="$AIGUARD_EXTENSION_IDENTITY"
          deb_name=$(dpkg-deb -f "$deb" Package)
          deb_installed=0
          appimage_registered=0
          export XDG_CONFIG_HOME="$RUNNER_TEMP/aiguard-appimage-config"
          export XDG_DATA_HOME="$RUNNER_TEMP/aiguard-appimage-data"
          mkdir -p artifacts/desktop-native-linux
          phase_file="artifacts/desktop-native-linux/last-started-phase.json"
          record_phase() {
            printf '{"phase":"%s"}\n' "$1" > "$phase_file"
          }
          lease_holder_pid=""
          lease_fifo=""
          lease_ready=""
          cleanup_registration() {
            if [ -n "$lease_holder_pid" ] && kill -0 "$lease_holder_pid" 2>/dev/null; then
              kill "$lease_holder_pid" >/dev/null 2>&1 || true
              wait "$lease_holder_pid" >/dev/null 2>&1 || true
            fi
            [ -z "$lease_fifo" ] || rm -f -- "$lease_fifo"
            [ -z "$lease_ready" ] || rm -f -- "$lease_ready"
            if [ "$appimage_registered" = 1 ]; then
              APPIMAGE_EXTRACT_AND_RUN=1 "$GITHUB_WORKSPACE/$appimage" --unregister-native-host >/dev/null 2>&1 || true
            fi
            if [ "$deb_installed" = 1 ]; then
              sudo dpkg -r "$deb_name" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_registration EXIT

          # Real dpkg install, same-candidate upgrade, removal, reinstall, and
          # final removal. Package hooks own the global drain and exact stale
          # runtime cleanup; every smoke must return to zero native processes.
          record_phase deb-install
          sudo dpkg -i "$deb"
          deb_installed=1
          python scripts/verify_native_host_registration.py \
            --shape deb --state present \
            --adapter /usr/bin/aiguard-chrome-native-host \
            --identity "$identity" \
            > artifacts/desktop-native-linux/deb-registration-present.json
          # D-Bus-activated GTK services must inherit the virtual display.
          xvfb-run -a -e /dev/stderr dbus-run-session -- sh -c \
            'python scripts/smoke_desktop_native_package.py /usr/bin --repetitions 2 > "$1"' \
            sh artifacts/desktop-native-linux/deb-smoke-evidence.json

          record_phase deb-live-upgrade
          xvfb-run -a -e /dev/stderr dbus-run-session -- sh -c \
            'python scripts/smoke_live_deb_upgrade.py /usr/bin "$1" > "$2"' \
            sh "$GITHUB_WORKSPACE/$deb" artifacts/desktop-native-linux/deb-upgrade-smoke-evidence.json
          python scripts/verify_native_host_registration.py \
            --shape deb --state present \
            --adapter /usr/bin/aiguard-chrome-native-host \
            --identity "$identity" \
            > artifacts/desktop-native-linux/deb-upgrade-registration-present.json
          (cd /usr/bin && sha256sum desktop aiguard-native-broker aiguard-chrome-native-host aiguard-native-host-manager aiguard native-components-v1.json) > artifacts/desktop-native-linux/deb-component-sha256.txt

          record_phase deb-remove
          sudo dpkg -r "$deb_name"
          deb_installed=0
          python scripts/verify_native_host_registration.py \
            --shape deb --state absent \
            --adapter /usr/bin/aiguard-chrome-native-host \
            --identity "$identity" \
            > artifacts/desktop-native-linux/deb-registration-absent.json
          for component in desktop aiguard-native-broker aiguard-chrome-native-host aiguard-native-host-manager aiguard native-components-v1.json; do
            test ! -e "/usr/bin/$component"
          done

          record_phase deb-reinstall
          sudo dpkg -i "$deb"
          deb_installed=1
          python scripts/verify_native_host_registration.py \
            --shape deb --state present \
            --adapter /usr/bin/aiguard-chrome-native-host \
            --identity "$identity" \
            > artifacts/desktop-native-linux/deb-reinstall-registration-present.json
          xvfb-run -a -e /dev/stderr dbus-run-session -- sh -c \
            'python scripts/smoke_desktop_native_package.py /usr/bin --repetitions 2 > "$1"' \
            sh artifacts/desktop-native-linux/deb-reinstall-smoke-evidence.json

          # Simulate process loss after current-manager removal has published
          # its exact receipt and an early unlink has begun. Repeated prerm
          # must finish the partial set, and the exact DEB must recover it.
          record_phase deb-interrupted-remove-manager
          sudo timeout --signal=TERM --kill-after=5s 60s \
            /usr/bin/aiguard-native-host-manager remove deb > "$RUNNER_TEMP/deb-remove-token"
          grep -Eq '^[0-9a-f]{64}$' "$RUNNER_TEMP/deb-remove-token"
          sudo rm -f -- /usr/bin/desktop
          record_phase deb-interrupted-remove-first-prerm
          sudo timeout --signal=TERM --kill-after=5s 60s \
            sh "$GITHUB_WORKSPACE/desktop/src-tauri/linux/deb-prerm.sh" remove
          record_phase deb-interrupted-remove-second-prerm
          sudo timeout --signal=TERM --kill-after=5s 60s \
            sh "$GITHUB_WORKSPACE/desktop/src-tauri/linux/deb-prerm.sh" remove
          for component in desktop aiguard-native-broker aiguard-chrome-native-host aiguard-native-host-manager aiguard; do
            test ! -e "/usr/bin/$component"
          done
          test -f /usr/bin/.aiguard-component-maintenance-v1
          test -f /usr/bin/.aiguard-component-transaction-v1
          if compgen -G '/tmp/aiguard-native-broker-*-v1' > /dev/null; then
            echo "interrupted DEB retry left a product runtime root" >&2
            exit 1
          fi
          record_phase deb-interrupted-remove-reinstall
          sudo dpkg -i "$deb"
          python scripts/verify_native_host_registration.py \
            --shape deb --state present \
            --adapter /usr/bin/aiguard-chrome-native-host \
            --identity "$identity" \
            > artifacts/desktop-native-linux/deb-interrupted-remove-recovery-registration-present.json
          record_phase deb-interrupted-remove-final-remove
          sudo dpkg -r "$deb_name"
          deb_installed=0
          python scripts/verify_native_host_registration.py \
            --shape deb --state absent \
            --adapter /usr/bin/aiguard-chrome-native-host \
            --identity "$identity" \
            > artifacts/desktop-native-linux/deb-final-registration-absent.json
          if compgen -G '/tmp/aiguard-native-broker-*-v1' > /dev/null; then
            echo "DEB cleanup left a product runtime root" >&2
            exit 1
          fi
          printf '%s\n' '["package-install","same-candidate-upgrade","package-remove","package-reinstall","interrupted-prerm-recovery","final-package-remove"]' > artifacts/desktop-native-linux/deb-lifecycle.json

          record_phase appimage-register
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"
          APPIMAGE_EXTRACT_AND_RUN=1 "$GITHUB_WORKSPACE/$appimage" --register-native-host
          appimage_registered=1
          stable_root="$XDG_DATA_HOME/aiguard/native-host-v1/$(cat VERSION)"
          python scripts/verify_native_host_registration.py \
            --shape appimage --state present \
            --adapter "$stable_root/aiguard-chrome-native-host" \
            --identity "$identity" \
            > artifacts/desktop-native-linux/appimage-registration-present.json

          # Hold the same shared-root flock as the product-wide lease. The real
          # manager must reject the contender promptly with its fixed status,
          # leave the package unchanged, then succeed after release.
          record_phase appimage-lease-contention
          shared_root=$(dirname "$stable_root")
          lease_fifo="$RUNNER_TEMP/aiguard-appimage-lease-release"
          lease_ready="$RUNNER_TEMP/aiguard-appimage-lease-held"
          test ! -e "$lease_fifo"
          test ! -e "$lease_ready"
          mkfifo "$lease_fifo"
          (
            exec 8< "$shared_root"
            flock -n 8
            printf 'held\n' > "$lease_ready"
            IFS= read -r release < "$lease_fifo"
            test "$release" = release
          ) &
          lease_holder_pid=$!
          lease_observed=0
          for _attempt in $(seq 1 200); do
            if [ -f "$lease_ready" ]; then
              lease_observed=1
              break
            fi
            kill -0 "$lease_holder_pid" 2>/dev/null
            sleep 0.05
          done
          test "$lease_observed" = 1
          fingerprint_stable_root() {
            (
              cd "$stable_root"
              {
                find . -mindepth 1 -maxdepth 1 -printf '%P %y %m %s\0' | sort -z
                find . -mindepth 1 -maxdepth 1 -type f -print0 | \
                  sort -z | xargs -0 -r sha256sum
              } | sha256sum
            )
          }
          before_contention=$(fingerprint_stable_root)
          set +e
          timeout --signal=TERM --kill-after=5s 60s \
            "$stable_root/aiguard-native-host-manager" repair appimage \
            >/dev/null 2>&1
          contender_status=$?
          set -e
          test "$contender_status" = 75
          after_contention=$(fingerprint_stable_root)
          test "$after_contention" = "$before_contention"
          python scripts/verify_native_host_registration.py \
            --shape appimage --state present \
            --adapter "$stable_root/aiguard-chrome-native-host" \
            --identity "$identity" \
            > artifacts/desktop-native-linux/appimage-contention-registration-present.json
          printf '{"registration_unchanged":true,"stable_root_unchanged":true,"contender_exit":75}\n' \
            > artifacts/desktop-native-linux/appimage-lease-contention.json
          timeout --signal=TERM --kill-after=2s 10s \
            sh -c 'printf "release\n" > "$1"' sh "$lease_fifo"
          lease_released=0
          for _attempt in $(seq 1 200); do
            if ! kill -0 "$lease_holder_pid" 2>/dev/null; then
              lease_released=1
              break
            fi
            sleep 0.05
          done
          test "$lease_released" = 1
          wait "$lease_holder_pid"
          lease_holder_pid=""
          rm -f -- "$lease_fifo" "$lease_ready"
          lease_fifo=""
          lease_ready=""
          timeout --signal=TERM --kill-after=5s 120s env APPIMAGE_EXTRACT_AND_RUN=1 \
            "$GITHUB_WORKSPACE/$appimage" --repair-native-host
          python scripts/verify_native_host_registration.py \
            --shape appimage --state present \
            --adapter "$stable_root/aiguard-chrome-native-host" \
            --identity "$identity" \
            > artifacts/desktop-native-linux/appimage-repair-registration-present.json
          record_phase appimage-stable-smoke
          xvfb-run -a -e /dev/stderr dbus-run-session -- sh -c \
            'python scripts/smoke_desktop_native_package.py "$1" --repetitions 2 > "$2"' \
            sh "$stable_root" artifacts/desktop-native-linux/appimage-stable-smoke-evidence.json

          record_phase appimage-stable-cleanup
          APPIMAGE_EXTRACT_AND_RUN=1 "$GITHUB_WORKSPACE/$appimage" --unregister-native-host
          appimage_registered=0
          python scripts/verify_native_host_registration.py \
            --shape appimage --state absent \
            --adapter "$stable_root/aiguard-chrome-native-host" \
            --identity "$identity" \
            > artifacts/desktop-native-linux/appimage-registration-absent.json
          test ! -e "$stable_root"
          if compgen -G '/tmp/aiguard-native-broker-*-v1' > /dev/null; then
            echo "AppImage cleanup left a product runtime root" >&2
            exit 1
          fi

          record_phase appimage-stable-reinstall
          APPIMAGE_EXTRACT_AND_RUN=1 "$GITHUB_WORKSPACE/$appimage" --register-native-host
          appimage_registered=1
          python scripts/verify_native_host_registration.py \
            --shape appimage --state present \
            --adapter "$stable_root/aiguard-chrome-native-host" \
            --identity "$identity" \
            > artifacts/desktop-native-linux/appimage-reinstall-registration-present.json
          xvfb-run -a -e /dev/stderr dbus-run-session -- sh -c \
            'python scripts/smoke_desktop_native_package.py "$1" --repetitions 2 > "$2"' \
            sh "$stable_root" artifacts/desktop-native-linux/appimage-reinstall-smoke-evidence.json
          APPIMAGE_EXTRACT_AND_RUN=1 "$GITHUB_WORKSPACE/$appimage" --unregister-native-host
          appimage_registered=0
          python scripts/verify_native_host_registration.py \
            --shape appimage --state absent \
            --adapter "$stable_root/aiguard-chrome-native-host" \
            --identity "$identity" \
            > artifacts/desktop-native-linux/appimage-final-registration-absent.json
          test ! -e "$stable_root"
          if compgen -G '/tmp/aiguard-native-broker-*-v1' > /dev/null; then
            echo "AppImage final cleanup left a product runtime root" >&2
            exit 1
          fi
          record_phase appimage-outer-modes
          extracted_deb="$RUNNER_TEMP/aiguard-deb"
          extracted_appimage="$RUNNER_TEMP/aiguard-appimage"
          test ! -e "$extracted_deb"
          test ! -e "$extracted_appimage"
          mkdir -p "$extracted_deb" "$extracted_appimage" artifacts/desktop-native-linux
          dpkg-deb -x "$deb" "$extracted_deb"
          (
            cd "$extracted_appimage"
            "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null
          )
          appimage_registered=1
          xvfb-run -a -e /dev/stderr dbus-run-session -- sh -c \
            'python scripts/smoke_desktop_native_package.py "$1" --repetitions 2 --finalized-appimage "$3" --appimage-layout "$4" > "$2"' \
            sh "$extracted_appimage/squashfs-root/usr/bin" artifacts/desktop-native-linux/appimage-smoke-evidence.json \
            "$GITHUB_WORKSPACE/$appimage" "$extracted_appimage/squashfs-root"

          # Normal FUSE execution is a distinct evidence class. Hosted runners
          # without a usable /dev/fuse record the limitation instead of
          # relabeling extract-and-run evidence.
          if [ -c /dev/fuse ] && [ -r /dev/fuse ] && [ -w /dev/fuse ]; then
            xvfb-run -a -e /dev/stderr dbus-run-session -- sh -c \
              'python scripts/smoke_desktop_native_package.py "$1" --repetitions 1 --finalized-appimage "$3" --appimage-layout "$4" --appimage-outer-mode fuse > "$2"' \
              sh "$extracted_appimage/squashfs-root/usr/bin" artifacts/desktop-native-linux/appimage-fuse-smoke-evidence.json \
              "$GITHUB_WORKSPACE/$appimage" "$extracted_appimage/squashfs-root"
          else
            printf '%s\n' '{"execution_mode":"outer_appimage_fuse","status":"unavailable_on_runner"}' > artifacts/desktop-native-linux/appimage-fuse-smoke-evidence.json
          fi
          APPIMAGE_EXTRACT_AND_RUN=1 "$GITHUB_WORKSPACE/$appimage" --unregister-native-host
          appimage_registered=0
          python scripts/verify_native_host_registration.py \
            --shape appimage --state absent \
            --adapter "$stable_root/aiguard-chrome-native-host" \
            --identity "$identity" \
            > artifacts/desktop-native-linux/appimage-outer-final-registration-absent.json
          test ! -e "$stable_root"
          if compgen -G '/tmp/aiguard-native-broker-*-v1' > /dev/null; then
            echo "AppImage outer smoke cleanup left a product runtime root" >&2
            exit 1
          fi
          printf '%s\n' '["stable-register","lease-contention-rejection","repair-after-release","stable-cleanup","stable-reinstall","outer-modes","final-cleanup"]' > artifacts/desktop-native-linux/appimage-lifecycle.json
          : > artifacts/desktop-native-linux/package-sha256.txt
          (cd "$deb_root" && sha256sum "$(basename "$deb")") >> artifacts/desktop-native-linux/package-sha256.txt
          (cd "$appimage_root" && sha256sum "$(basename "$appimage")") >> artifacts/desktop-native-linux/package-sha256.txt
          archive="$GITHUB_WORKSPACE/artifacts/desktop-native-linux/AI-Guard-linux-tested-packages.tar.gz"
          tar -czf "$archive" -C "$deb_root" "$(basename "$deb")" -C "$GITHUB_WORKSPACE/$appimage_root" "$(basename "$appimage")"
          (cd artifacts/desktop-native-linux && sha256sum AI-Guard-linux-tested-packages.tar.gz) > artifacts/desktop-native-linux/archive-sha256.txt
          record_phase complete
          cat artifacts/desktop-native-linux/deb-smoke-evidence.json
          cat artifacts/desktop-native-linux/deb-upgrade-smoke-evidence.json
          cat artifacts/desktop-native-linux/deb-reinstall-smoke-evidence.json
          cat artifacts/desktop-native-linux/appimage-smoke-evidence.json
          cat artifacts/desktop-native-linux/appimage-fuse-smoke-evidence.json
          trap - EXIT

      - name: Require complete exact Linux evidence on success
        if: success() && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          evidence="artifacts/desktop-native-linux"
          test -s "$evidence/AI-Guard-linux-tested-packages.tar.gz"
          test -s "$evidence/archive-sha256.txt"
          grep -Fxq '{"phase":"complete"}' "$evidence/last-started-phase.json"

      - name: Upload the exact tested Linux packages and value-free evidence
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-native-linux-${{ github.sha }}
          path: |
            artifacts/desktop-native-linux/AI-Guard-linux-tested-packages.tar.gz
            artifacts/desktop-native-linux/*.json
            artifacts/desktop-native-linux/*.txt
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
