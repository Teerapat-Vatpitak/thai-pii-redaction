[package]
name = "aiguard-native-broker-protocol"
version = "2.5.0"
edition = "2021"
publish = false

[[bin]]
name = "aiguard-native-broker"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
getrandom = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[dev-dependencies]
hex = "0.4"
