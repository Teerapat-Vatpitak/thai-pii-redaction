<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Guard — สนามทดลอง</title>
<style>
  :root{
    /* This page runs alone, so it cannot load Desktop tokens.
       The page script still uses --dim and --c-* names. */
    --md-sys-color-surface:#131316;
    --md-sys-color-surface-container:#1f1f23;
    --md-sys-color-on-surface:#e4e2e6;
    --md-sys-color-on-surface-variant:#c5c6d0;
    --md-sys-color-outline:#8f909a;
    --md-sys-color-outline-variant:#45464f;
    --md-sys-color-primary:#b4c5ff;
    --md-sys-color-on-primary:#002a78;
    --md-sys-color-secondary-container:#414659;
    --md-sys-color-on-secondary-container:#dde1f9;
    --md-sys-color-error-container:#93000a;
    --md-sys-color-on-error-container:#ffdad6;

    /* shape + state-layer constants, matching desktop/src/tokens.css */
    --md-sys-shape-corner-full:9999px;
    --md-sys-shape-corner-medium:12px;
    --md-sys-shape-corner-small:8px;
    --md-sys-shape-corner-extra-small:4px;
    --md-sys-state-hover-state-layer-opacity:0.08;
    --md-sys-state-focus-state-layer-opacity:0.12;
    --md-sys-state-pressed-state-layer-opacity:0.12;

    /* type scale (rem values from the MD3 spec) */
    --md-sys-typescale-label-large-size:0.875rem; --md-sys-typescale-label-large-line-height:1.25rem; --md-sys-typescale-label-large-weight:500;
    --md-sys-typescale-body-medium-size:0.875rem; --md-sys-typescale-body-medium-line-height:1.25rem; --md-sys-typescale-body-medium-weight:400;
    --md-sys-typescale-body-small-size:0.75rem; --md-sys-typescale-body-small-line-height:1rem; --md-sys-typescale-body-small-weight:400;
    --md-sys-typescale-title-medium-size:1rem; --md-sys-typescale-title-medium-line-height:1.5rem; --md-sys-typescale-title-medium-weight:500;
    --md-sys-typescale-headline-small-size:1.5rem; --md-sys-typescale-headline-small-line-height:2rem; --md-sys-typescale-headline-small-weight:400;

    --dim:var(--md-sys-color-on-surface-variant);
    /* MD3 has no warning role; advisory text takes tertiary, which this page
       therefore has to declare — it is not inherited from anywhere. */
    --md-sys-color-tertiary:#e2bbdb;
    --warn:var(--md-sys-color-tertiary);

    /* Per-type highlights are MD3 extended custom colours: the hues readers
       already associate with each type, but put through the same tonal process
       as the core roles. This page ships dark, so containers are tone 30 and
       their on-colours tone 90, matching how the core dark roles are built.
       Generated with @material/material-color-utilities, not picked by eye. */
    --c-name:#762a5b; --c-name-on:#ffd8ea;
    --c-id:#7e2a2f; --c-id-on:#ffdad9;
    --c-phone:#683c00; --c-phone-on:#ffdcbd;
    --c-email:#524600; --c-email-on:#ffe24c;
    --c-addr:#00522d; --c-addr-on:#8ff8b4;
    --c-date:#00497b; --c-date-on:#d0e4ff;
    --c-org:#4a388c; --c-org-on:#e7deff;
    --c-other:#2c4090; --c-other-on:#dde1ff;
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--md-sys-color-surface);color:var(--md-sys-color-on-surface);font-family:'Sarabun','Leelawadee UI',system-ui,sans-serif;padding:24px;min-height:100vh}
  h1{
    font-size:var(--md-sys-typescale-headline-small-size);
    line-height:var(--md-sys-typescale-headline-small-line-height);
    font-weight:var(--md-sys-typescale-headline-small-weight);
    margin-bottom:4px;
  }
  .sub{color:var(--md-sys-color-on-surface-variant);font-size:var(--md-sys-typescale-body-medium-size);line-height:var(--md-sys-typescale-body-medium-line-height);margin-bottom:20px}
  .controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .controls label{font-size:var(--md-sys-typescale-body-medium-size);color:var(--md-sys-color-on-surface-variant)}

  /* ---- text field (outlined select) ---- */
  select{
    background:transparent;color:var(--md-sys-color-on-surface);
    border:1px solid var(--md-sys-color-outline);border-radius:var(--md-sys-shape-corner-extra-small);
    height:40px;padding:0 14px;font-family:inherit;font-size:var(--md-sys-typescale-body-medium-size);cursor:pointer;
    transition:border-color .2s cubic-bezier(0.2,0,0,1);
  }
  select:hover{border-color:var(--md-sys-color-on-surface)}
  select:focus{outline:none;border-color:var(--md-sys-color-primary);border-width:2px;padding:0 13px}

  /* ---- buttons ----
     Filled (primary/on-primary) or outlined (1px outline, primary text); the
     ::before pseudo-element is the MD3 state layer, same mechanic as
     desktop/src/styles.css's .btn (hover .08 / focus .12 / pressed .12 of
     --state-color). */
  button{
    position:relative;isolation:isolate;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:transparent;color:var(--md-sys-color-primary);
    border:1px solid var(--md-sys-color-outline);border-radius:var(--md-sys-shape-corner-full);
    height:40px;padding:0 24px;font-family:inherit;
    font-size:var(--md-sys-typescale-label-large-size);
    line-height:var(--md-sys-typescale-label-large-line-height);
    font-weight:var(--md-sys-typescale-label-large-weight);
    cursor:pointer;
    --state-color:var(--md-sys-color-primary);
  }
  button::before{
    content:"";position:absolute;inset:0;border-radius:inherit;
    background:var(--state-color, var(--md-sys-color-on-surface));opacity:0;
    transition:opacity .2s cubic-bezier(0.2,0,0,1);pointer-events:none;z-index:-1;
  }
  button:hover:not(:disabled)::before{opacity:var(--md-sys-state-hover-state-layer-opacity)}
  button:focus-visible::before{opacity:var(--md-sys-state-focus-state-layer-opacity)}
  button:active:not(:disabled)::before{opacity:var(--md-sys-state-pressed-state-layer-opacity)}
  button:focus-visible{outline:3px solid var(--md-sys-color-primary);outline-offset:2px}
  button.primary{background:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary);border-color:transparent;--state-color:var(--md-sys-color-on-primary)}
  button:disabled{
    cursor:wait;
    background:color-mix(in srgb, var(--md-sys-color-on-surface) 12%, transparent);
    color:color-mix(in srgb, var(--md-sys-color-on-surface) 38%, transparent);
    border-color:transparent;
  }
  button:disabled::before{opacity:0}

  /* ---- sample chips ---- */
  .samples{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .samples button{
    background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container);
    border-color:transparent;--state-color:var(--md-sys-color-on-secondary-container);
    height:32px;padding:0 16px;border-radius:var(--md-sys-shape-corner-small);
  }

  .panes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;min-height:340px}
  @media(max-width:900px){.panes{grid-template-columns:1fr}}
  .pane{
    background:var(--md-sys-color-surface-container);
    border:1px solid var(--md-sys-color-outline-variant);border-radius:var(--md-sys-shape-corner-medium);
    display:flex;flex-direction:column;overflow:hidden;
  }
  .pane h2{
    font-size:var(--md-sys-typescale-title-medium-size);
    line-height:var(--md-sys-typescale-title-medium-line-height);
    font-weight:var(--md-sys-typescale-title-medium-weight);
    padding:10px 14px;border-bottom:1px solid var(--md-sys-color-outline-variant);color:var(--md-sys-color-on-surface-variant);
  }
  .pane .body{padding:12px 14px;flex:1;position:relative;font-size:15px;line-height:1.9;white-space:pre-wrap;word-break:break-word;overflow:auto}
  /* ช่องซ้าย: textarea โปร่งใสทับ div ไฮไลต์ */
  #editorWrap{position:relative;flex:1}
  #editorWrap:focus-within{outline:2px solid var(--md-sys-color-primary);outline-offset:-2px}
  #highlight,#editor{position:absolute;inset:0;padding:12px 14px;font:inherit;font-size:15px;line-height:1.9;white-space:pre-wrap;word-break:break-word;overflow:auto}
  #highlight{pointer-events:none;color:var(--md-sys-color-on-surface)}
  #editor{background:transparent;color:transparent;caret-color:var(--md-sys-color-on-surface);border:0;outline:0;resize:none;width:100%;height:100%}
  mark{border-radius:4px;padding:0 1px;color:var(--md-sys-color-surface);font-weight:600}
  .legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;font-size:var(--md-sys-typescale-body-small-size);color:var(--md-sys-color-on-surface-variant)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block}
  .meta{margin-top:10px;font-size:var(--md-sys-typescale-body-small-size);color:var(--md-sys-color-on-surface-variant);min-height:20px}
  .warn{color:var(--warn)}
  .provider-tag{
    font-size:var(--md-sys-typescale-body-small-size);
    background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container);
    border-radius:var(--md-sys-shape-corner-small);padding:2px 8px;margin-left:8px;
  }
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tabs button.active{background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container);border-color:transparent;--state-color:var(--md-sys-color-on-secondary-container)}
  .tabpage{display:none}
  .tabpage.active{display:block}
  #cmpWrap{position:relative;max-width:860px;margin-top:14px;overflow:hidden;border-radius:var(--md-sys-shape-corner-medium);border:1px solid var(--md-sys-color-outline-variant)}
  #cmpWrap img{display:block;width:100%;user-select:none;pointer-events:none}
  #imgAfter{position:absolute;inset:0;clip-path:inset(0 0 0 50%)}
  #cmpSlider{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
  #cmpBar{position:absolute;top:0;bottom:0;left:50%;width:3px;background:var(--md-sys-color-primary);pointer-events:none}
  .pdfmeta{margin-top:10px;font-size:var(--md-sys-typescale-body-medium-size);color:var(--md-sys-color-on-surface-variant)}
  #guardBar{margin-top:10px;font-size:var(--md-sys-typescale-body-small-size);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .guard-chip{background:var(--md-sys-color-error-container);color:var(--md-sys-color-on-error-container);border-radius:var(--md-sys-shape-corner-small);padding:2px 8px}
  .guard-ok{color:var(--md-sys-color-on-surface-variant)}
</style>
</head>
<body>
<h1>AI Guard — สนามทดลอง</h1>
<p class="sub">ใช้ข้อมูลสังเคราะห์เพื่อดูว่าระบบพยายามตรวจ ปกปิด และกู้คืนอย่างไร ก่อนเรียกโมเดล demo จะบล็อก residual PII ที่ตัวตรวจปัจจุบันพบ</p>

<div class="tabs">
  <button data-tab="tab-text" class="active">ข้อความ</button>
  <button data-tab="tab-pdf">ทาดำเอกสาร PDF</button>
</div>

<div id="tab-text" class="tabpage active">
<div class="samples">
  <span style="color:var(--dim);font-size:13px;align-self:center">ตัวอย่าง</span>
  <button data-sample="เรียนหัวหน้างาน ผมชื่อ นายสมชาย ใจดี ขอลาป่วยวันนี้ ติดต่อกลับได้ที่ 081-234-5678 หรือ somchai.j@example.com ครับ">อีเมลลาป่วย</button>
  <button data-sample="ผู้ป่วยชื่อ นางสาวมนัสนันท์ วงศ์สว่าง เลขบัตรประชาชน 1-1017-00230-70-8 เกิดวันที่ 12 มีนาคม 2534 มีอาการแพ้ยาปฏิชีวนะ นัดติดตามอาการที่โรงพยาบาลสงขลานครินทร์">เวชระเบียน</button>
  <button data-sample="ขอเชิญ นายวีรภัทร ตั้งตระกูล บ้านเลขที่ 99/12 ถนนกาญจนวณิชย์ ตำบลหาดใหญ่ อำเภอหาดใหญ่ จังหวัดสงขลา 90110 เข้าร่วมประชุมประชาคม โทร 074-123-456">หนังสือราชการ</button>
</div>

<div class="controls">
  <label>รูปแบบการปกปิด
    <select id="mode">
      <option value="token">โทเคนแยกชุด เช่น [ชื่อ_…_1]</option>
      <option value="surrogate">ข้อมูลสมมุติ (อ่านเป็นธรรมชาติ)</option>
    </select>
  </label>
  <label>โมเดลปลายทาง
    <select id="provider">
      <option value="fake">จำลอง (ทดสอบวงจร ไม่เรียกโมเดลจริง)</option>
      <option value="pathumma">Pathumma LLM (AI for Thai)</option>
      <option value="tokenmind">Tokenmind thaillm-8b (LLM ของงานแข่ง)</option>
      <option value="ollama">Ollama (ในเครื่อง)</option>
      <option value="claude">Claude</option>
    </select>
  </label>
  <button id="send" class="primary" disabled>ลองปกปิดแล้วส่งเข้า AI</button>
  <button id="reportBtn" disabled>ออกรายงาน PDPA (PDF)</button>
</div>

<div class="panes">
  <section class="pane">
    <h2>1. ข้อความของคุณ (ตรวจจับสดขณะพิมพ์)</h2>
    <div id="editorWrap">
      <div id="highlight" aria-hidden="true"></div>
      <textarea id="editor" spellcheck="false" placeholder="พิมพ์ที่นี่..."></textarea>
    </div>
  </section>
  <section class="pane">
    <h2>2. สิ่งที่ AI เห็นจริง ๆ</h2>
    <div class="body" id="masked"><span style="color:var(--dim)">ยังไม่ได้ส่ง</span></div>
  </section>
  <section class="pane">
    <h2>3. คำตอบที่กู้คืนแล้ว <span id="providerTag" class="provider-tag" hidden></span></h2>
    <div class="body" id="restored"><span style="color:var(--dim)">ยังไม่ได้ส่ง</span></div>
  </section>
</div>

<div class="legend" id="legend"></div>
<div class="meta" id="meta"></div>
<div id="guardBar"></div>
</div><!-- /tab-text -->

<div id="tab-pdf" class="tabpage">
  <input type="file" id="pdfFile" accept="application/pdf" hidden>
  <button id="pdfPick" class="primary" disabled>เลือกไฟล์ PDF</button>
  <span id="pdfStatus" class="pdfmeta"></span>
  <div id="cmpWrap" hidden>
    <img id="imgAfter" alt="หลังทาดำ">
  </div>
  <div class="pdfmeta" id="pdfInfo"></div>
  <button id="pdfDownload" hidden>ดาวน์โหลด PDF ที่ทาดำแล้ว</button>
</div><!-- /tab-pdf -->

<script>
"use strict";
// A highlight needs the container and its on-container together, so each entry
// carries both. The var() names are written out in full rather than assembled
// at runtime: a name built from a template string cannot be checked against the
// declarations, and tests/test_ui_tokens_sync.py checks exactly that.
const COLORS = {
  NAME: { bg: "var(--c-name)", on: "var(--c-name-on)" },
  THAI_ID: { bg: "var(--c-id)", on: "var(--c-id-on)" },
  PHONE: { bg: "var(--c-phone)", on: "var(--c-phone-on)" },
  EMAIL: { bg: "var(--c-email)", on: "var(--c-email-on)" },
  ADDRESS: { bg: "var(--c-addr)", on: "var(--c-addr-on)" },
  LOCATION: { bg: "var(--c-addr)", on: "var(--c-addr-on)" },
  DATE: { bg: "var(--c-date)", on: "var(--c-date-on)" },
  DATE_OF_BIRTH: { bg: "var(--c-date)", on: "var(--c-date-on)" },
  ORGANIZATION: { bg: "var(--c-org)", on: "var(--c-org-on)" },
};
const OTHER_COLOR = { bg: "var(--c-other)", on: "var(--c-other-on)" };
const THAI_LABELS = {
  NAME: "ชื่อบุคคล", THAI_ID: "เลขบัตรประชาชน", PHONE: "เบอร์โทรศัพท์",
  EMAIL: "อีเมล", ADDRESS: "ที่อยู่", LOCATION: "สถานที่", DATE: "วันที่",
  DATE_OF_BIRTH: "วันเกิด", ORGANIZATION: "องค์กร", BANK_ACCOUNT: "เลขบัญชี",
  CREDIT_CARD: "บัตรเครดิต", PASSPORT: "หนังสือเดินทาง", ID_NUMBER: "เลขอ้างอิง",
  STUDENT_ID: "รหัสนักศึกษา", VEHICLE_PLATE: "ทะเบียนรถ", IBAN: "IBAN",
};
const colorFor = t => COLORS[t] || OTHER_COLOR;
const labelFor = t => THAI_LABELS[t] || t;
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const V2_HEADER = "X-AIGuard-Contract-Version";
const V2_VALUE = "2";
const SECTION26 = new Set([
  "RACE_ETHNICITY", "POLITICAL_OPINION", "RELIGION", "HEALTH",
  "SEXUAL_BEHAVIOR", "CRIMINAL_RECORD", "DISABILITY", "LABOR_UNION",
]);
const GUARD_CATEGORIES = new Set([
  "instruction_override", "role_hijack", "exfiltration", "hidden_chars",
  "suspicious_payload",
]);
const GUARD_SEVERITIES = new Set(["low", "medium", "high"]);
const RESTORE_WARNINGS = new Set(["generated_pii", "foreign_replacement"]);
const PDF_WARNINGS = new Set(["ocr_low_confidence", "human_review_required"]);
const COUNTED_ERROR_CODES = new Set([
  "request_schema_invalid", "residual_pii", "ner_incomplete", "ner_unavailable",
]);
const REDACT_TYPES = new Set(["FP", "TB"]);
const GRADES = new Set(["A", "B", "C", "D", "F"]);
const ERROR_SPECS = new Map([
  ["contract_version_required", [426, "contract", false]],
  ["invalid_request", [400, "request", false]],
  ["request_schema_invalid", [422, "request", false]],
  ["authentication_required", [401, "authentication", false]],
  ["control_forbidden", [403, "authentication", false]],
  ["route_not_found", [404, "request", false]],
  ["session_unavailable", [404, "session", false]],
  ["method_not_allowed", [405, "request", false]],
  ["rate_limited", [429, "service", true]],
  ["payload_too_large", [413, "request", false]],
  ["residual_pii", [422, "privacy", false]],
  ["document_invalid", [422, "document", false]],
  ["provider_unavailable", [502, "upstream", true]],
  ["provider_rejected", [502, "upstream", false]],
  ["provider_response_invalid", [502, "upstream", false]],
  ["ner_incomplete", [502, "upstream", false]],
  ["provider_configuration", [503, "configuration", false]],
  ["dependency_unavailable", [503, "dependency", false]],
  ["ocr_unavailable", [503, "dependency", false]],
  ["service_unavailable", [503, "service", true]],
  ["restore_failed", [500, "internal", false]],
  ["internal_error", [500, "internal", false]],
]);
let contractReady = false;

function invalid(label) {
  throw new Error("invalid " + label + " response");
}
function object(value, label) {
  if (value === null || typeof value !== "object" || Array.isArray(value)) invalid(label);
  return value;
}
function exact(value, keys, label) {
  const source = object(value, label);
  const actual = Object.keys(source).sort();
  const expected = [...keys].sort();
  if (actual.length !== expected.length || actual.some((key, i) => key !== expected[i])) {
    invalid(label);
  }
  return source;
}
function textValue(value, label, nonempty = false) {
  if (typeof value !== "string" || (nonempty && !value)) invalid(label);
  return value;
}
function integer(value, label, positive = false) {
  if (!Number.isInteger(value) || value < (positive ? 1 : 0)) invalid(label);
  return value;
}
function enumValue(value, allowed, label) {
  if (!allowed.has(value)) invalid(label);
  return value;
}
function finite(value, min, max, label) {
  if (!Number.isFinite(value) || value < min || value > max) invalid(label);
  return value;
}
function uniqueEnums(value, allowed, label) {
  if (!Array.isArray(value)) invalid(label);
  const canonical = [...allowed];
  let previousIndex = -1;
  return value.map(item => {
    const projected = enumValue(item, allowed, label);
    const index = canonical.indexOf(projected);
    if (index <= previousIndex) invalid(label);
    previousIndex = index;
    return projected;
  });
}
function counts(value, label) {
  const source = object(value, label);
  const projected = {};
  for (const [key, count] of Object.entries(source)) {
    if (!/^[A-Z][A-Z0-9_]*$/.test(key)) invalid(label);
    projected[key] = integer(count, label, true);
  }
  return projected;
}
function dataType(value, label) {
  const projected = textValue(value, label, true);
  if (!/^[A-Z][A-Z0-9_]*$/.test(projected)) invalid(label);
  return projected;
}
function sumCounts(value) {
  return Object.values(value).reduce((sum, count) => sum + count, 0);
}
function warnings(value, allowed, label) {
  if (!Array.isArray(value)) invalid(label);
  const seen = new Set();
  const projected = value.map(warning => {
    const item = exact(warning, ["code", "count"], label);
    const code = enumValue(item.code, allowed, label);
    if (seen.has(code)) invalid(label);
    seen.add(code);
    return {code, count: integer(item.count, label, true)};
  });
  const expected = [...allowed].filter(code => seen.has(code));
  if (projected.some((warning, index) => warning.code !== expected[index])) {
    invalid(label);
  }
  return projected;
}
function guardFindings(value, label) {
  if (!Array.isArray(value)) invalid(label);
  const seen = new Set();
  return value.map(finding => {
    const item = exact(finding, ["category", "severity"], label);
    const projected = {
      category: enumValue(item.category, GUARD_CATEGORIES, label),
      severity: enumValue(item.severity, GUARD_SEVERITIES, label),
    };
    const key = projected.category + ":" + projected.severity;
    if (seen.has(key)) invalid(label);
    seen.add(key);
    return projected;
  });
}
function highlights(value, sourceText, label) {
  if (!Array.isArray(value)) invalid(label);
  const length = Array.from(sourceText).length;
  let previousEnd = 0;
  return value.map(row => {
    const item = exact(row, ["start", "end", "data_type", "redact_type"], label);
    const start = integer(item.start, label);
    const end = integer(item.end, label);
    if (start >= end || start < previousEnd || end > length) invalid(label);
    previousEnd = end;
    return {
      start,
      end,
      data_type: dataType(item.data_type, label),
      redact_type: enumValue(item.redact_type, REDACT_TYPES, label),
    };
  });
}
function validateHealth(value) {
  const item = exact(value, ["status", "version", "contract_version", "capabilities"], "health");
  const capabilities = exact(
    item.capabilities,
    ["control_token_required", "api_key_required"],
    "health"
  );
  if (
    item.status !== "ok" ||
    item.contract_version !== 2 ||
    typeof capabilities.control_token_required !== "boolean" ||
    typeof capabilities.api_key_required !== "boolean"
  ) invalid("health");
  return {
    status: "ok",
    version: textValue(item.version, "health", true),
    contract_version: 2,
    capabilities: {
      control_token_required: capabilities.control_token_required,
      api_key_required: capabilities.api_key_required,
    },
  };
}
function validateDetect(value, sourceText) {
  const item = exact(
    value,
    ["detected_entity_count", "entity_type_counts", "highlights"],
    "detect"
  );
  const entityCounts = counts(item.entity_type_counts, "detect");
  const detected = integer(item.detected_entity_count, "detect");
  const projectedHighlights = highlights(item.highlights, sourceText, "detect");
  if (sumCounts(entityCounts) !== detected || projectedHighlights.length !== detected) {
    invalid("detect");
  }
  return {
    detected_entity_count: detected,
    entity_type_counts: entityCounts,
    highlights: projectedHighlights,
  };
}
function validateGuard(value) {
  const item = exact(value, ["flagged", "guard_findings"], "guard");
  const findings = guardFindings(item.guard_findings, "guard");
  if (typeof item.flagged !== "boolean" || item.flagged !== (findings.length > 0)) {
    invalid("guard");
  }
  return {flagged: item.flagged, guard_findings: findings};
}
function validateRoundtrip(value, requestedProvider) {
  const item = exact(
    value,
    [
      "sanitized_text", "ai_response_masked", "restored_text",
      "detected_entity_count", "entity_type_counts", "provider_used",
      "section26_categories", "guard_findings", "warnings", "safety",
      "restoration",
    ],
    "roundtrip"
  );
  const entityCounts = counts(item.entity_type_counts, "roundtrip");
  const detected = integer(item.detected_entity_count, "roundtrip");
  if (sumCounts(entityCounts) !== detected || item.provider_used !== requestedProvider) {
    invalid("roundtrip");
  }
  const safety = exact(item.safety, ["status", "residual_count"], "roundtrip");
  if (safety.status !== "pass" || safety.residual_count !== 0) invalid("roundtrip");
  const projectedWarnings = warnings(item.warnings, RESTORE_WARNINGS, "roundtrip");
  const restoration = exact(
    item.restoration,
    ["status", "replaced_count", "leftover_count"],
    "roundtrip"
  );
  if (!new Set(["complete", "incomplete", "unsafe"]).has(restoration.status)) {
    invalid("roundtrip");
  }
  const leftoverCount = integer(restoration.leftover_count, "roundtrip");
  const warningPresent = projectedWarnings.length > 0;
  if (
    (restoration.status === "complete" && (leftoverCount !== 0 || warningPresent)) ||
    (restoration.status === "incomplete" && (leftoverCount === 0 || warningPresent)) ||
    (restoration.status === "unsafe" && !warningPresent)
  ) invalid("roundtrip");
  return {
    sanitized_text: textValue(item.sanitized_text, "roundtrip"),
    ai_response_masked: textValue(item.ai_response_masked, "roundtrip"),
    restored_text: textValue(item.restored_text, "roundtrip"),
    detected_entity_count: detected,
    entity_type_counts: entityCounts,
    provider_used: item.provider_used,
    section26_categories: uniqueEnums(item.section26_categories, SECTION26, "roundtrip"),
    guard_findings: guardFindings(item.guard_findings, "roundtrip"),
    warnings: projectedWarnings,
    safety: {status: "pass", residual_count: 0},
    restoration: {
      status: restoration.status,
      replaced_count: integer(restoration.replaced_count, "roundtrip"),
      leftover_count: leftoverCount,
    },
  };
}
function validateReport(value) {
  const item = exact(value, ["report_pdf_b64", "overall_score", "overall_grade"], "report");
  return {
    report_pdf_b64: textValue(item.report_pdf_b64, "report", true),
    overall_score: finite(item.overall_score, 0, 100, "report"),
    overall_grade: enumValue(item.overall_grade, GRADES, "report"),
  };
}
function validatePdf(value) {
  const item = exact(
    value,
    [
      "source_type", "ocr_confidence", "human_review", "warnings",
      "detected_entity_count", "entity_type_counts", "fields",
      "section26_categories", "redacted_pdf_b64", "after_png_b64",
    ],
    "redact-pdf"
  );
  const entityCounts = counts(item.entity_type_counts, "redact-pdf");
  const detected = integer(item.detected_entity_count, "redact-pdf");
  if (sumCounts(entityCounts) !== detected || !Array.isArray(item.fields)) {
    invalid("redact-pdf");
  }
  const projectedFields = item.fields.map(field => {
    const row = exact(field, ["data_type", "redact_type"], "redact-pdf");
    return {
      data_type: dataType(row.data_type, "redact-pdf"),
      redact_type: enumValue(row.redact_type, REDACT_TYPES, "redact-pdf"),
    };
  });
  const fieldKeys = projectedFields.map(
    field => field.data_type + "\u0000" + field.redact_type
  );
  if (new Set(fieldKeys).size !== fieldKeys.length) invalid("redact-pdf");
  if (!new Set(["pdf_text", "pdf_hybrid"]).has(item.source_type)) invalid("redact-pdf");
  if (typeof item.human_review !== "boolean") invalid("redact-pdf");
  return {
    source_type: item.source_type,
    ocr_confidence: item.ocr_confidence === null
      ? null : finite(item.ocr_confidence, 0, 1, "redact-pdf"),
    human_review: item.human_review,
    warnings: warnings(item.warnings, PDF_WARNINGS, "redact-pdf"),
    detected_entity_count: detected,
    entity_type_counts: entityCounts,
    fields: projectedFields,
    section26_categories: uniqueEnums(
      item.section26_categories,
      SECTION26,
      "redact-pdf"
    ),
    redacted_pdf_b64: textValue(item.redacted_pdf_b64, "redact-pdf", true),
    after_png_b64: textValue(item.after_png_b64, "redact-pdf", true),
  };
}
function validateError(value, status) {
  const outer = exact(value, ["error"], "error");
  const item = exact(
    outer.error,
    ["code", "category", "count", "retryable", "status"],
    "error"
  );
  let spec = ERROR_SPECS.get(item.code);
  if (item.code === "ner_unavailable") {
    const valid =
      ((item.category === "configuration" || item.category === "dependency") &&
        item.retryable === false) ||
      ((item.category === "network" || item.category === "upstream") &&
        item.retryable === true);
    if (!valid || item.status !== 503) invalid("error");
    spec = [503, item.category, item.retryable];
  }
  if (
    !spec ||
    item.status !== status ||
    item.status !== spec[0] ||
    item.category !== spec[1] ||
    item.retryable !== spec[2]
  ) invalid("error");
  const count = integer(item.count, "error");
  if (!COUNTED_ERROR_CODES.has(item.code) && count !== 0) invalid("error");
  return {
    error: {
      code: item.code,
      category: item.category,
      count,
      retryable: item.retryable,
      status: item.status,
    },
  };
}
function hasV2Header(response) {
  return response && response.headers &&
    typeof response.headers.get === "function" &&
    response.headers.get(V2_HEADER) === V2_VALUE;
}
function setContractReady(ready) {
  contractReady = Boolean(ready);
  document.getElementById("send").disabled = !contractReady;
  document.getElementById("reportBtn").disabled = !contractReady;
  document.getElementById("pdfPick").disabled = !contractReady;
}
async function parseResponse(response, validator) {
  if (!hasV2Header(response)) {
    setContractReady(false);
    invalid("contract");
  }
  let body;
  try {
    body = await response.json();
  } catch {
    setContractReady(false);
    invalid("JSON");
  }
  if (!response.ok) {
    setContractReady(false);
    const error = validateError(body, response.status);
    throw new Error(error.error.code);
  }
  try {
    return validator(body);
  } catch {
    setContractReady(false);
    invalid("operation");
  }
}
async function requireFreshHealth() {
  setContractReady(false);
  let response;
  try {
    response = await fetch("/api/health", {cache: "no-store"});
  } catch {
    setContractReady(false);
    throw new Error("backend_unavailable");
  }
  const health = await parseResponse(response, validateHealth);
  if (health.capabilities.api_key_required) {
    setContractReady(false);
    throw new Error("authentication_required");
  }
  setContractReady(true);
  return health;
}
async function requestV2(path, options, validator) {
  await requireFreshHealth();
  const headers = {
    ...(options.headers || {}),
    [V2_HEADER]: V2_VALUE,
  };
  let response;
  try {
    response = await fetch(path, {...options, headers});
  } catch {
    setContractReady(false);
    throw new Error("backend_unavailable");
  }
  return parseResponse(response, validator);
}
async function checkHealth() {
  try {
    await requireFreshHealth();
    meta.textContent = "พร้อมใช้งาน HTTP v2";
  } catch {
    setContractReady(false);
    meta.textContent = "backend HTTP v2 ยังไม่พร้อมใช้งาน";
  }
}
function codePointRangeToUtf16(text, start, end) {
  const points = Array.from(text);
  if (
    !Number.isInteger(start) || !Number.isInteger(end) ||
    start < 0 || end < start || end > points.length
  ) throw new Error("invalid code-point range");
  return [
    points.slice(0, start).join("").length,
    points.slice(0, end).join("").length,
  ];
}

const editor = document.getElementById("editor");
const highlight = document.getElementById("highlight");
const meta = document.getElementById("meta");
let debounceTimer = null;

function renderHighlight(text, entities) {
  const parts = [];
  let cursor = 0;
  for (const entity of entities) {
    const [start, end] = codePointRangeToUtf16(text, entity.start, entity.end);
    parts.push({text: text.slice(cursor, start)});
    parts.push({text: text.slice(start, end), type: entity.data_type});
    cursor = end;
  }
  parts.push({text: text.slice(cursor)});
  const html = parts.map(p => p.type
    ? `<mark style="background:${colorFor(p.type).bg};color:${colorFor(p.type).on}" title="${esc(labelFor(p.type))}">${esc(p.text)}</mark>`
    : esc(p.text)).join("");
  highlight.innerHTML = html + "\n"; // กัน scroll ท้ายเพี้ยนตอนบรรทัดสุดท้ายว่าง
}

function renderLegend(counts) {
  const legend = document.getElementById("legend");
  legend.innerHTML = Object.entries(counts).map(([t, n]) =>
    `<span><i class="dot" style="background:${colorFor(t).bg}"></i>${esc(labelFor(t))} (${n})</span>`
  ).join("");
}

async function detectNow() {
  const text = editor.value;
  if (!text.trim()) { highlight.textContent = ""; renderLegend({}); meta.textContent = ""; return; }
  if (!contractReady) return;
  try {
    const body = await requestV2("/api/detect", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text}),
    }, value => validateDetect(value, text));
    renderHighlight(text, body.highlights);
    renderLegend(body.entity_type_counts);
    meta.textContent = `พบข้อมูลส่วนบุคคล ${body.detected_entity_count} รายการ`;
    try {
      const guard = await requestV2("/api/guard", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({text}),
      }, validateGuard);
      const bar = document.getElementById("guardBar");
      bar.innerHTML = guard.flagged
        ? '<span class="guard-ok">ตรวจ prompt injection (rules + intent):</span> '
          + guard.guard_findings.map(g =>
            `<span class="guard-chip">${esc(g.category)} (${esc(g.severity)})</span>`
          ).join("")
        : '<span class="guard-ok">ตรวจ prompt injection (rules + intent): ไม่พบสัญญาณ</span>';
    } catch { /* เครือข่ายล้ม ปล่อย */ }
  } catch { /* เครือข่ายล้ม — ปล่อยรอบถัดไป */ }
}

editor.addEventListener("input", () => {
  highlight.textContent = editor.value; // อัปเดตข้อความทันที ไฮไลต์ตามมา
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(detectNow, 400);
});
editor.addEventListener("scroll", () => {
  highlight.scrollTop = editor.scrollTop; highlight.scrollLeft = editor.scrollLeft;
});

document.querySelectorAll(".samples button").forEach(btn => {
  btn.addEventListener("click", () => {
    editor.value = btn.dataset.sample;
    editor.dispatchEvent(new Event("input"));
  });
});

document.getElementById("send").addEventListener("click", async () => {
  if (!contractReady) return;
  const text = editor.value;
  if (!text.trim()) return;
  const btn = document.getElementById("send");
  const masked = document.getElementById("masked");
  const restored = document.getElementById("restored");
  const tag = document.getElementById("providerTag");
  btn.disabled = true;
  meta.textContent = "กำลังปกปิดและเรียกผู้ให้บริการ...";
  const provider = document.getElementById("provider").value;
  try {
    const body = await requestV2("/api/roundtrip", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        text,
        mode: document.getElementById("mode").value,
        provider,
      }),
    }, value => validateRoundtrip(value, provider));
    if (
      body.safety.status !== "pass" ||
      body.safety.residual_count !== 0 ||
      body.restoration.status !== "complete"
    ) {
      throw new Error("unsafe_or_incomplete");
    }
    masked.textContent = body.sanitized_text;
    restored.textContent = body.restored_text;
    tag.textContent = body.provider_used;
    tag.hidden = false;
    meta.textContent =
      `ประมวลผล ${body.detected_entity_count} รายการ ` +
      "และผ่านการตรวจความปลอดภัย";
  } catch {
    meta.textContent = "ส่งไม่สำเร็จ ผลลัพธ์ไม่ถูกนำไปแสดงหรือใช้งาน";
  } finally {
    btn.disabled = !contractReady;
  }
});

// ── แท็บ ──
document.querySelectorAll(".tabs button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b === btn));
    document.querySelectorAll(".tabpage").forEach(p => p.classList.toggle("active", p.id === btn.dataset.tab));
  });
});

// ── แท็บทาดำ PDF ──
const pdfFile = document.getElementById("pdfFile");
let redactedB64 = null;
let redactedName = "redacted.pdf";
document.getElementById("pdfPick").addEventListener("click", () => pdfFile.click());
pdfFile.addEventListener("change", async () => {
  const f = pdfFile.files[0];
  if (!f || !contractReady) return;
  const status = document.getElementById("pdfStatus");
  status.textContent = "กำลังประมวลผล...";
  redactedB64 = null;
  document.getElementById("pdfDownload").hidden = true;
  document.getElementById("cmpWrap").hidden = true;
  const fd = new FormData();
  fd.append("pdf_file", f);
  try {
    const body = await requestV2(
      "/api/redact-pdf",
      {method: "POST", body: fd},
      validatePdf
    );
    document.getElementById("imgAfter").src = "data:image/png;base64," + body.after_png_b64;
    document.getElementById("cmpWrap").hidden = false;
    redactedB64 = body.redacted_pdf_b64;
    redactedName = "redacted_" + f.name;
    const s26 = body.section26_categories.length
      ? " ธงมาตรา 26: " + body.section26_categories.join(", ")
      : "";
    document.getElementById("pdfInfo").textContent =
      `ปกปิด ${body.detected_entity_count} รายการ (แสดงภาพหลังปกปิด)` + s26;
    document.getElementById("pdfDownload").hidden = false;
    status.textContent = "";
  } catch {
    status.textContent = "ปกปิด PDF ไม่สำเร็จ";
  }
});
function downloadB64(b64, name, mime) {
  const bytes = Uint8Array.from(atob(b64), ch => ch.charCodeAt(0));
  const url = URL.createObjectURL(new Blob([bytes], {type: mime}));
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  a.click();
  URL.revokeObjectURL(url);
}
document.getElementById("pdfDownload").addEventListener("click", () => {
  if (redactedB64) downloadB64(redactedB64, redactedName, "application/pdf");
});

// ── รายงาน PDPA ──
document.getElementById("reportBtn").addEventListener("click", async () => {
  if (!contractReady) return;
  const text = editor.value;
  if (!text.trim()) return;
  const btn = document.getElementById("reportBtn");
  btn.disabled = true;
  try {
    const body = await requestV2("/api/analyze-report", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text}),
    }, validateReport);
    downloadB64(body.report_pdf_b64, "pdpa_report.pdf", "application/pdf");
    meta.textContent = `ออกรายงานแล้ว คะแนนรวม ${body.overall_score} เกรด ${body.overall_grade}`;
  } catch {
    meta.textContent = "ออกรายงานไม่สำเร็จ";
  } finally {
    btn.disabled = !contractReady;
  }
});
setContractReady(false);
checkHealth();
